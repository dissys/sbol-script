<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>SBOL3 Promoter Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/rdflib/dist/rdflib.min.js"></script>
    <script src="./dist/sbol-script.js"></script>
    <style>
        pre { white-space: pre-wrap; word-wrap: break-word; background: #f8f9fa; padding: 1rem; border-radius: 6px; border: 1px solid #ddd; }
    </style>
</head>

<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">SBOL3 Promoter Example</h1>

    <div class="card mb-4">
        <div class="card-header bg-primary text-white">Turtle (text/turtle)</div>
        <div class="card-body"><pre id="turtleOutput"></pre></div>
    </div>
</div>

<script>
    const { SBOLDocument, SBOLAPI, RDFFormat, DNARole } = window.sbolScript;

    const doc = new SBOLDocument('https://example.org/');
    const promoter = SBOLAPI.createPromoterDNAComponent(doc, 'https://example.org/promA', 'https://example.org');
    promoter.setName('Promoter A');
    document.getElementById('turtleOutput').textContent = doc.toRDF(RDFFormat.RDF_XML);
    console.log(doc.toRDF(RDFFormat.RDF_XML));
</script>
</body>
</html>
